[project]
name = "advanced-rag-backend"
version = "0.1.0"
description = "Advanced RAG backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    # Configuration and validation
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    # Logging
    "structlog==25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.14.14",
]